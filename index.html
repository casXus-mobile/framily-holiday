:root{--cream:#F3E7D0;--ink:#16301F;--gold:#D9B56C}
*{box-sizing:border-box}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth;height:100%}
body{margin:0;background:#0E0E10;color:var(--cream);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#0E0E10;position:relative;box-shadow:0 0 60px rgba(0,0,0,.6)}
section.ev{padding:36px 24px 44px;display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always;min-height:100vh;min-height:100svh}
.next{position:absolute;left:0;right:0;bottom:8px;text-align:center;opacity:.5;cursor:pointer;background:none;border:0;color:inherit;padding:6px}
section.ev>*{position:relative}
.kicker{font-size:11px;font-weight:700;letter-spacing:3px}
.lead{font-size:15px;line-height:1.45}
.tiles{display:grid;gap:8px}
.tile{border-radius:10px;padding:12px;text-align:center}
.tile .big{font-size:22px;line-height:1}
.tile .sm{font-size:11px;line-height:1.3;margin-top:4px}
.btns{display:flex;gap:8px}
.btn{border:0;border-radius:999px;padding:14px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;flex:1;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.o{background:transparent;border:2px solid currentColor;flex:0 0 auto;padding:12px 14px;font-size:14px}
.btn.o.dim{opacity:.7}
.btn.sel{outline:3px solid #fff;outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;border-radius:10px;padding:10px 14px}
.step{display:flex;align-items:center;gap:12px}
.step button{width:30px;height:30px;border-radius:50%;border:1px solid currentColor;background:transparent;color:inherit;font-size:18px;cursor:pointer}
.step span{font-weight:700;font-size:16px;width:22px;text-align:center}
.tot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid currentColor;padding-top:10px;font-size:12px;opacity:.9}
.tot b{font-size:18px}
details{border-radius:10px;padding:10px 14px}
details summary{list-style:none;display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:2px;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details ul{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.4}
details a{font-weight:700}
a{color:inherit}
.link{font-size:13px;text-decoration:underline}
.cal{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid currentColor;border-radius:999px;padding:10px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;background:transparent;color:inherit;font-family:inherit;width:100%}
.hidden{display:none !important}
.pill{font-size:10px;font-weight:700;letter-spacing:2px;border:1px solid currentColor;border-radius:999px;padding:4px 10px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;pointer-events:none}
#bar>div{pointer-events:auto;width:100%;max-width:480px;background:var(--ink);color:var(--cream);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--gold);box-shadow:0 -8px 30px rgba(0,0,0,.5)}
#bar b{font-size:14px}
#bar small{font-size:11px;opacity:.8;display:block}
#bar button{background:var(--gold);color:var(--ink);border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-family:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
#lang{position:fixed;top:10px;right:10px;z-index:60;display:flex;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.4);border-radius:999px;overflow:hidden;backdrop-filter:blur(6px)}
#lang button{background:transparent;color:#fff;border:0;padding:6px 10px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;opacity:.6}
#lang button.on{opacity:1;background:rgba(255,255,255,.2)}
input.t{width:100%;font-family:inherit;font-size:15px;padding:12px;border:1px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;letter-spacing:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#fff;color:#111;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.modal>div{width:100%;max-width:480px;background:var(--cream);color:var(--ink);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-height:92vh;overflow:auto}
.modal h3{font-family:'Fraunces',serif;font-weight:900;font-size:20px;margin:0}
.modal label.c{display:flex;align-items:flex-start;gap:10px;background:#fff;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4}
.modal label.c input{width:18px;height:18px;margin-top:1px}
.modal label.c.lock{opacity:.6;background:#E6DCC8}
.mbtn{background:var(--ink);color:var(--cream);border:0;border-radius:999px;padding:13px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.mbtn.alt{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.handle{width:36px;height:4px;background:#C9BEA9;border-radius:2px;margin:0 auto 4px}
@media (min-width:600px){body{background:#0a0a0c url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22><circle cx=%2230%22 cy=%2230%22 r=%221%22 fill=%22%23222%22/></svg>')}}
/* admin */
#admin{max-width:1100px;margin:0 auto;padding:24px;background:var(--cream);color:var(--ink);min-height:100vh;font-size:14px}

#admin th{background:var(--ink);color:var(--cream);font-size:11px;letter-spacing:2px;padding:10px;text-align:left}
#admin td{padding:8px 10px;border-bottom:1px solid #EADBC3;vertical-align:top}
#admin .chip{border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;display:inline-block}
#admin .k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
#admin .k div{border-radius:12px;padding:12px 14px;color:#fff}
#admin .k b{font-size:26px;display:block}
#admin button{font-family:inherit;cursor:pointer}
#admin .tb{background:#fff;border:1px solid var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:12px;margin-right:6px}
#admin .tb.on{background:var(--ink);color:var(--cream)}
#admin input{font-family:inherit;padding:8px;border:1px solid #999;border-radius:6px}

(function(){
 const u=new URL(location.href);
 const v=u.searchParams.get('v'); const l=u.searchParams.get('lang'); const a=u.searchParams.get('admin');
 if(v==='xmas'){ls('tier','xmas')}
 if(l==='es'||l==='en'){ls('lang',l)}
 if(a!==null){S.admin=true}
 if(v||l){u.searchParams.delete('v');u.searchParams.delete('lang');history.replaceState({},'',u.pathname+(u.search||''))}
 S.tier=ls('tier')==='xmas'?'xmas':'open';
 S.lang=ls('lang')||((navigator.language||'').toLowerCase().startsWith('es')?'es':'en');
 S.token=ls('token');
})();

const price=id=>(S.events.find(e=>e.id===id)||{}).price_cents||0;
const rs=id=>S.rs[id]||(S.rs[id]={status:null,headcount:0,players:0,watchers:0,paid_claimed:false,paid_confirmed:false});
const visibleEvents=()=>S.events.filter(e=>e.tier==='open'||(e.tier==='xmas'&&S.tier==='xmas')||(e.tier==='lillie'&&S.lillie));
function evTotal(id){const r=rs(id);if(r.status!=='in')return 0;const n=id==='topgolf'?r.players:r.headcount;return n*price(id)}
function owed(){return visibleEvents().filter(e=>!rs(e.id).paid_confirmed).reduce((a,e)=>a+evTotal(e.id),0)}
function inCount(){return visibleEvents().filter(e=>rs(e.id).status==='in').length}
const money=c=>'$'+(c/100).toFixed(0);
function fmtPhone(p){p=(p||'').replace(/\D/g,'').slice(-10);return p.length===10?`(${p.slice(0,3)}) ${p.slice(3,6)}-${p.slice(6)}`:p}

async function submitRsvp(){
 const L=t(); S.name=($('#fName').value||'').trim(); S.phone=$('#fPhone').value; S.sms=$('#fSms').checked;
 const digits=S.phone.replace(/\D/g,'').slice(-10);
 if(!S.name||digits.length!==10){toast(!S.name?L.need_name:L.bad_phone);$('#lock').scrollIntoView({behavior:'smooth'});return}
 if(!Object.values(S.rs).some(r=>r.status)){toast(L.nothing);return}
 const btn=$('#sendBtn'); btn.disabled=true; btn.textContent='…';
 try{
  const {data:fam,error}=await sb.rpc('family_start',{p_name:S.name,p_phone:digits,p_lang:S.lang,p_tier:S.tier});
  if(error)throw error;
  S.token=fam.token; ls('token',S.token); S.lillie=!!fam.lillie; if(fam.tier==='xmas'){S.tier='xmas';ls('tier','xmas')}
  await sb.rpc('family_update',{p_token:S.token,p_name:S.name,p_lang:S.lang,p_sms_optin:S.sms});
  const sent=$('#fSent')?.checked||false;
  for(const e of visibleEvents()){const r=rs(e.id); if(!r.status)continue;
   const {error:er}=await sb.rpc('rsvp_set',{p_token:S.token,p_event:e.id,p_status:r.status,p_headcount:r.headcount|0,p_players:r.players|0,p_watchers:r.watchers|0,p_paid_claimed:(sent&&evTotal(e.id)>0)?true:null});
   if(er){ if((er.message||'').includes('full')){toast(L.full);r.status='maybe'} else if(!(er.message||'').includes('not_invited')) throw er; }
  }
  S.done=true; await loadFamily(); toast(L.saved); render(); $('#lock').scrollIntoView({behavior:'smooth'});
 }catch(e){console.error(e);toast('Hmm, that didn\'t save. Try again or text Jared.');}
 btn.disabled=false;
}
async function loadFamily(){
 if(!S.token)return;
 const {data:f}=await sb.rpc('family_get',{p_token:S.token}); if(!f){ls('token','');S.token=null;return}
 S.name=f.name;S.phone=f.phone;S.sms=!!f.sms_optin;S.lillie=!!f.lillie;if(f.tier==='xmas'){S.tier='xmas';ls('tier','xmas')}
 S.lang=f.lang||S.lang; S.done=true;
 const srv={}; for(const r of (f.rsvps||[])) srv[r.event_id]={status:r.status,headcount:r.headcount,players:r.players,watchers:r.watchers,paid_claimed:r.paid_claimed,paid_confirmed:r.paid_confirmed};
 S.rs=Object.assign({},S.rs,srv); persistLocal();
}

 const start=new Date(e.arrive_at), end=new Date(new Date(e.starts_at).getTime()+2.5*3600e3);
 const desc=[`${nm} · FRamily Holiday Fun`,e.venue,e.address,price(id)?`${money(price(id))} ${S.lang==='es'?'por persona':'per person'} · Zelle ${ZELLE}`:'',d.dress?`${L.dress}: ${d.dress}`:'',`RSVP: ${SITE}`].filter(Boolean).join('\\n');

  return `<div style="background:${col[e.id]}"><div style="font-size:10px;letter-spacing:2px;font-weight:700;opacity:.85">${esc(chipLabel(e.id))}</div><b>${n}${cap}</b><div style="font-size:11px;opacity:.85">${s.fams} families${lanes}${price(e.id)?` · $${s.paid/100} / $${(s.paid+s.owed)/100}`:''}${s.maybe?` · ${s.maybe} maybe`:''}</div></div>`}).join('');
 const unpaidTotal=Object.values(stat).reduce((a,s)=>a+s.owed,0);
 const rows=fams.filter(f=>filt==='all'||f.rsvps.some(r=>r.event_id===filt&&r.status!=='out')).map(f=>{
  const cells=evs.map(e=>{const r=f.rsvps.find(x=>x.event_id===e.id);const inv=e.tier==='open'||(e.tier==='xmas'&&f.tier==='xmas')||(e.tier==='lillie'&&f.lillie);
   if(!inv)return `<td style="opacity:.35">—</td>`; if(!r)return `<td style="opacity:.5">?</td>`;
   if(r.status==='out')return `<td style="opacity:.5">out</td>`; if(r.status==='maybe')return `<td style="color:#9A6B00">maybe ${r.headcount}</td>`;
   const amt=(e.id==='topgolf'?r.players:r.headcount)*price(e.id); const cnt=e.id==='topgolf'?`${r.players}+${r.watchers}`:r.headcount;
   let pay=''; if(amt){pay=r.paid_confirmed?`<span class="chip" style="background:#DFF2E4;color:#2F7A48">paid</span>`:`<button class="chip" data-pay="${f.id}|${e.id}" style="background:${r.paid_claimed?'#FFF1D6':'#FBE3E1'};color:${r.paid_claimed?'#9A6B00':'#C8302E'};border:0">${r.paid_claimed?'says sent':'due'} $${amt/100} ✓?</button>`}
   return `<td><b>${cnt}</b> ${pay}</td>`}).join('');
  return `<tr><td><b>${esc(f.name)}</b><br><span style="font-size:11px;opacity:.7">${f.tier==='xmas'?'family':'open'}${f.lillie?' · lillie':''}${f.invited_friend_to_xmas?' · invited friend to xmas':''}${f.sms_optin?' · 📱':''} · ${f.lang}</span></td><td>${fmtPhone(f.phone)}</td>${cells}</tr>`}).join('');
 const lil=(data.lillie_list||[]).map(l=>`<span class="chip" style="background:#fff;border:1px solid #D4AF37;margin:2px">${esc(l.name||'')} ${fmtPhone(l.phone)} <button data-lrm="${l.phone}" style="border:0;background:none;color:#C8302E;font-weight:700">×</button></span>`).join('');
 A.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px"><div><div style="font-size:11px;letter-spacing:3px;font-weight:700;color:#5A1521">FRAMILY HOLIDAY FUN · ADMIN</div><div style="font-family:'Fraunces',serif;font-weight:900;font-size:30px">RSVPs &amp; payments</div></div>
  <div><button class="tb" id="copyPh">Copy phone list</button><button class="tb" id="csv">Download CSV</button><button class="tb" id="addF">+ Add family</button><button class="tb" id="out">Log out</button></div></div>
  <div class="k">${kpi}</div>
  <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:8px 0"><button class="tb ${filt==='all'?'on':''}" data-f="all">All</button>${evs.map(e=>`<button class="tb ${filt===e.id?'on':''}" data-f="${e.id}">${esc(chipLabel(e.id).split(' ')[1])}</button>`).join('')}<span style="margin-left:auto;font-weight:700;color:#C8302E">Unpaid: $${unpaidTotal/100}</span></div>
  <table><thead><tr><th>Family</th><th>Cell</th>${evs.map(e=>`<th>${esc(chipLabel(e.id).split(' ')[1])}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="8" style="opacity:.6;padding:20px">No RSVPs yet.</td></tr>'}</tbody></table>
  <div style="font-size:11px;opacity:.7;margin:8px 0 20px">Tap a red/yellow chip to mark it paid after you see the Zelle. "says sent" = guest tapped "I sent it".</div>
  <h3 style="font-family:'Fraunces',serif;margin:0 0 6px">Lillie's list (${(data.lillie_list||[]).length}/30)</h3>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><input id="ln" placeholder="Name"><input id="lp" placeholder="Cell" inputmode="tel"><button class="tb on" id="ladd">Add</button></div>
  <div>${lil||'<span style="opacity:.6">Empty. Add names and cells above, or paste a list to Claude.</span>'}</div>`;
 A.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.adminFilter=b.dataset.f;renderAdmin()});
 A.querySelectorAll('[data-pay]').forEach(b=>b.onclick=async()=>{const [fid,eid]=b.dataset.pay.split('|');await sb.rpc('admin_set_paid',{p_pass:pass,p_family:fid,p_event:eid,p_paid:true});renderAdmin()});
 A.querySelectorAll('[data-lrm]').forEach(b=>b.onclick=async()=>{await sb.rpc('admin_lillie_set',{p_pass:pass,p_phone:b.dataset.lrm,p_name:null,p_remove:true});renderAdmin()});
 $('#ladd').onclick=async()=>{const n=$('#ln').value,p=$('#lp').value;if(p.replace(/\D/g,'').length<10)return toast('Need a 10-digit cell');await sb.rpc('admin_lillie_set',{p_pass:pass,p_phone:p,p_name:n});renderAdmin()};
 $('#out').onclick=()=>{ls('adminpass','');renderAdmin()};
 $('#copyPh').onclick=()=>{const list=fams.filter(f=>filt==='all'||f.rsvps.some(r=>r.event_id===filt&&r.status==='in')).map(f=>fmtPhone(f.phone)).join(', ');navigator.clipboard?.writeText(list).then(()=>toast('Copied '+list.split(', ').length+' numbers'))};
 $('#csv').onclick=()=>{const h=['family','cell','tier','lillie','sms','lang',...evs.flatMap(e=>[e.id+'_status',e.id+'_count',e.id+'_paid'])];const r=fams.map(f=>[f.name,f.phone,f.tier,f.lillie,f.sms_optin,f.lang,...evs.flatMap(e=>{const x=f.rsvps.find(y=>y.event_id===e.id)||{};return [x.status||'',x.status==='in'?(e.id==='topgolf'?`${x.players}+${x.watchers}`:x.headcount):'',x.paid_confirmed?'paid':(x.paid_claimed?'claimed':'')]})]);const csv=[h,...r].map(a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='framily-rsvps.csv';a.click()};
 $('#addF').onclick=async()=>{const n=prompt('Family name');if(!n)return;const p=prompt('Cell');if(!p)return;const tier=confirm('Invited to Christmas? OK = yes')?'xmas':'open';await sb.rpc('admin_add_family',{p_pass:pass,p_name:n,p_phone:p,p_tier:tier});renderAdmin()};
}

/* ---------- boot ---------- */
async function boot(){
 document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;ls('lang',S.lang);render()});
 const {data:evs}=await sb.from('events').select('*').order('sort'); S.events=evs||[];
 const {data:counts}=await sb.rpc('event_counts'); S.counts=counts||{};
 loadLocal(); await loadFamily();
 render();
 window.addEventListener('scroll',updateBar,{passive:true});
 $('#barBtn').onclick=()=>$('#lock').scrollIntoView({behavior:'smooth'});
}
boot();
</script>
</body>
